name: Validate League images
on:
  push:
    branches:
      - feat/league-reward-artwork
    paths:
      - scripts/download-league-rewards.py
      - .github/workflows/league-rewards.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/download-league-rewards.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game tarkov/local-assets.js
          git diff --cached --quiet && exit 0
          git commit -m "Add League reward artwork"
          git push
