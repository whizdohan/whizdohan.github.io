name: Validate opening quest icons
on:
  push:
    branches:
      - fix/first-quest-letter-and-case-icons
    paths:
      - scripts/install-first-quest-icons.py
      - .github/workflows/first-quest-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/install-first-quest-icons.py
      - name: Commit verified images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game tarkov/dev-item-icons.js tarkov/local-assets.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore opening quest item icons"
          git push
