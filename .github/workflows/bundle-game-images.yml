name: Bundle game images
on:
  push:
    branches:
      - feat/bundle-game-images-and-credits
    paths:
      - scripts/bundle-game-assets.py
      - .github/workflows/bundle-game-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download images and update references
        run: python scripts/bundle-game-assets.py
      - name: Commit bundled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game tarkov/local-assets.js index.html tarkov/hub.js tarkov/trait-icons.js tarkov/dev-item-icons.js tarkov/prestige/prestige.js
          git diff --cached --quiet && exit 0
          git commit -m "Bundle game image files"
          git push
